services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyguard
      POSTGRES_USER: familyguard
      POSTGRES_PASSWORD: familyguard
    ports:
      - "5432:5432"
    volumes:
      - familyguard_db_data:/var/lib/postgresql/data

volumes:
  familyguard_db_data:
