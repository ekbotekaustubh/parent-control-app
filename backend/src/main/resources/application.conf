ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
}

jwt {
  # Local dev default only — MUST be overridden via JWT_SECRET in any real deployment.
  secret = "dev-only-insecure-secret-change-me-0123456789abcdef"
  secret = ${?JWT_SECRET}

  issuer = "familyguard-backend"
  issuer = ${?JWT_ISSUER}

  # Access token TTL, in seconds. 1200 = 20 minutes, matching api-spec.md's expiresIn.
  accessTokenTtlSeconds = 1200
  accessTokenTtlSeconds = ${?JWT_ACCESS_TOKEN_TTL_SECONDS}
}

database {
  jdbcUrl = "jdbc:postgresql://localhost:5432/familyguard"
  jdbcUrl = ${?DATABASE_URL}

  user = "familyguard"
  user = ${?DATABASE_USER}

  password = "familyguard"
  password = ${?DATABASE_PASSWORD}
}
